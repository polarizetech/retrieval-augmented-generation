[project]
name = "rag-domain-respiratory"
dynamic = ["version"]
description = "Respiratory science as a domain extension of the research pipeline."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."rag.domains"]
respiratory = "rag_respiratory"

[tool.hatch.version]
path = "rag_respiratory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rag_respiratory"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
