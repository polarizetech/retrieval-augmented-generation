[project]
name = "rag-domain-vestibular"
dynamic = ["version"]
description = "Vestibular science as a domain extension of the research pipeline."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."rag.domains"]
vestibular = "rag_vestibular"

[tool.hatch.version]
path = "rag_vestibular/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rag_vestibular"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
