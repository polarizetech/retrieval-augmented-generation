[project]
name = "rag-domain-neuroscience"
dynamic = ["version"]
description = "Neuroscience as a domain extension of the research pipeline."
requires-python = ">=3.11"
dependencies = []

[project.entry-points."rag.domains"]
neuroscience = "rag_neuroscience"

[tool.hatch.version]
path = "rag_neuroscience/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rag_neuroscience"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
