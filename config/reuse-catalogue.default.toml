# Open-source scientific packages with a peer-reviewed paper (or a reviewed registry entry), for the
# build-vs-reuse register (docs/reuse-register.md). The runner finds them in each repo's dependency
# files and imports, and names them as alternatives to custom code.
#
# Fields:
#   name     display name
#   does     the job, in a few words
#   review   "paper" (a journal or reviewed-proceedings methods paper), "joss" (reviewed by JOSS),
#            "registry" (listed, not reviewed) or "none"
#   paper    short citation;  doi  the paper's DOI ("" when it has none). `--check-dois` resolves them.
#   python   import names;  pypi  package names in dependency files;  npm  package names
#   markers  plain-text markers for tools that are not packages (MATLAB toolboxes, model names)
#   foundation = true for general numerical libraries counted apart from method libraries
#
# Add your own entries in the gitignored config/reuse-catalogue.toml in the same shape.

[numpy]
name = "NumPy"
does = "arrays and numerical routines"
review = "paper"
paper = "Harris et al. 2020, Nature"
doi = "10.1038/s41586-020-2649-2"
python = ["numpy"]
pypi = ["numpy"]
foundation = true

